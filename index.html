<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173f33" />
    <title>CL Petshop POS</title>
    <style>
      html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; overflow: hidden; background: #f4f2eb; }
    </style>
  </head>
  <body>
    <iframe src="./kasir-offline.html?build=20261003-0045" title="CL Petshop POS"></iframe>
    <script>
      if ('serviceWorker' in navigator) {
        let reloading = false
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return
          reloading = true
          window.location.reload()
        })
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistration().then((registration) => registration?.update())
        })
      }
    </script>
  </body>
</html>
